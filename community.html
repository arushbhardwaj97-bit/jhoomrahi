<!DOCTYPE html>
<!--
  JhoomRahi — Campus & City Communities Hub
  Phase 5 Final Core Phase
  Tech Stack: HTML5, Plain CSS, Tailwind CDN, Alpine.js, Lucide Icons
-->
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Communities & Campus Tribes — JhoomRahi</title>
  <meta name="description" content="Join verified college campus and city chapters across India. Real-time community feeds for flatmate searches, second-hand student markets, and travel squads.">

  <!-- Inline SVG Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%236366f1'/><text x='16' y='22' font-family='system-ui,sans-serif' font-size='18' font-weight='bold' fill='white' text-anchor='middle'>J</text></svg>">

  <!-- Google Fonts: Space Grotesk (Headings) + Inter (Body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: '#6366f1',
            'primary-600': '#4f46e5',
            accent: '#a3e635',
            coral: '#fb7185',
            amber: '#f59e0b',
            ink: 'var(--ink)',
            muted: 'var(--muted)',
            cream: 'var(--cream)',
            surface: 'var(--surface)',
            border: 'var(--border)',
          },
          fontFamily: {
            heading: ['"Space Grotesk"', 'sans-serif'],
            sans: ['Inter', 'sans-serif'],
          },
          borderRadius: {
            '4xl': '2rem',
          }
        }
      }
    };
  </script>

  <!-- Design System CSS -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/animations.css">

  <!-- Alpine.js CDN -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <!-- Canvas Confetti CDN -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <!-- Lucide Icons CDN -->
  <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body class="bg-[#fafaf7] dark:bg-[#0b1120] text-slate-900 dark:text-slate-100 antialiased selection:bg-indigo-500 selection:text-white overflow-x-hidden w-full max-w-full" x-data="communityApp()">

  <!-- ========================================================================= -->
  <!-- 1. STICKY NAV (GLASS)                                                     -->
  <!-- ========================================================================= -->
  <header id="navbar" class="sticky top-0 z-40 w-full nav-glass transition-all duration-300 border-b border-slate-200 dark:border-slate-800">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 h-20 flex items-center justify-between">
      
      <!-- Logo Mark -->
      <a href="dashboard.html" class="flex items-center gap-2 group">
        <div class="w-10 h-10 rounded-2xl bg-indigo-600 flex items-center justify-center text-white font-heading font-bold text-xl shadow-md group-hover:scale-105 transition-transform">
          J
        </div>
        <div class="flex flex-col">
          <span class="font-heading font-bold text-2xl tracking-tight text-slate-900 dark:text-white">
            Jhoom<span class="text-indigo-600 dark:text-indigo-400">Rahi</span>
          </span>
        </div>
      </a>

      <!-- Desktop Nav -->
      <nav class="hidden md:flex items-center gap-6 lg:gap-7 text-sm font-medium text-slate-600 dark:text-slate-300">
        <a href="dashboard.html" class="hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors py-2">Dashboard</a>
        <a href="stay/browse.html" class="hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors py-2">Stay</a>
        <a href="travel/calendar.html" class="hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors py-2">Travel</a>
        <a href="discover/city.html" class="hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors py-2">Discover</a>
        <a href="community.html" class="text-indigo-600 dark:text-indigo-400 font-semibold py-2">Communities</a>
        <a href="chat.html" class="hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors flex items-center gap-1.5 py-2">
          <span>Chat</span>
          <span class="w-2 h-2 rounded-full bg-lime-400 animate-pulse"></span>
        </a>
      </nav>

      <!-- Action Utilities -->
      <div class="hidden md:flex items-center gap-4">
        <!-- Theme Toggle -->
        <button type="button" data-theme-toggle class="p-2.5 rounded-2xl border border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors" aria-label="Toggle theme">
          <i data-lucide="moon" class="w-4 h-4 hidden dark:block"></i>
          <i data-lucide="sun" class="w-4 h-4 block dark:hidden"></i>
        </button>

        <!-- User Profile Pill -->
        <a href="chat.html" class="flex items-center gap-2.5 p-1.5 pr-3.5 rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 shadow-sm">
          <img src="https://picsum.photos/seed/rohan_dev/200/200" alt="Rohan Deshmukh" class="w-8 h-8 rounded-xl object-cover" loading="lazy">
          <div class="text-left text-xs leading-tight">
            <p class="font-bold text-slate-900 dark:text-white flex items-center gap-1">
              <span>Rohan D.</span>
              <i data-lucide="check-circle" class="w-3 h-3 text-indigo-500"></i>
            </p>
            <p class="text-[11px] text-slate-500 dark:text-slate-400">Bengaluru</p>
          </div>
        </a>
      </div>

      <!-- Mobile Menu Trigger -->
      <div class="flex items-center gap-2 md:hidden">
        <button type="button" data-theme-toggle class="p-2 rounded-xl border border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-300" aria-label="Toggle theme">
          <i data-lucide="moon" class="w-4 h-4 hidden dark:block"></i>
          <i data-lucide="sun" class="w-4 h-4 block dark:hidden"></i>
        </button>
        <a href="chat.html" class="p-2 rounded-xl bg-indigo-50 dark:bg-indigo-950/70 text-indigo-600 dark:text-indigo-400">
          <i data-lucide="message-square" class="w-5 h-5"></i>
        </a>
      </div>

    </div>
  </header>

  <!-- ========================================================================= -->
  <!-- 2. MAIN COMMUNITIES LAYOUT (GROUPS LIST + ACTIVE FEED)                     -->
  <!-- ========================================================================= -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 py-6 sm:py-8">
    
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
      
      <!-- ===================================================================== -->
      <!-- LEFT SIDEBAR: COMMUNITIES DISCOVERY (4 COLS ON LG)                    -->
      <!-- ===================================================================== -->
      <div class="lg:col-span-4 space-y-4">
        
        <div class="card p-5 space-y-4">
          <div class="flex items-center justify-between">
            <h2 class="font-heading font-bold text-lg text-slate-900 dark:text-white flex items-center gap-2">
              <i data-lucide="users" class="w-5 h-5 text-indigo-600"></i>
              <span>Communities</span>
            </h2>
            <span class="text-xs text-indigo-600 dark:text-indigo-400 font-semibold" x-text="communities.length + ' active'"></span>
          </div>

          <!-- Search Input -->
          <div class="relative">
            <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
            <input 
              type="text" 
              x-model="searchQuery" 
              placeholder="Search campus or city groups..." 
              class="w-full pl-9 pr-3 py-2 text-xs rounded-xl bg-slate-100 dark:bg-slate-800 border border-transparent focus:border-indigo-500 focus:bg-white dark:focus:bg-slate-900 text-slate-900 dark:text-white placeholder:text-slate-400 outline-none transition-colors">
          </div>

          <!-- Category Filters -->
          <div class="flex items-center gap-1.5 overflow-x-auto pb-1 text-xs no-scrollbar">
            <button 
              @click="activeTab = 'all'" 
              :class="activeTab === 'all' ? 'bg-indigo-600 text-white font-semibold' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400'"
              class="px-2.5 py-1 rounded-lg transition-colors whitespace-nowrap">
              All
            </button>
            <button 
              @click="activeTab = 'joined'" 
              :class="activeTab === 'joined' ? 'bg-indigo-600 text-white font-semibold' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400'"
              class="px-2.5 py-1 rounded-lg transition-colors whitespace-nowrap">
              Joined
            </button>
            <button 
              @click="activeTab = 'campus'" 
              :class="activeTab === 'campus' ? 'bg-indigo-600 text-white font-semibold' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400'"
              class="px-2.5 py-1 rounded-lg transition-colors whitespace-nowrap">
              Colleges
            </button>
            <button 
              @click="activeTab = 'city'" 
              :class="activeTab === 'city' ? 'bg-indigo-600 text-white font-semibold' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400'"
              class="px-2.5 py-1 rounded-lg transition-colors whitespace-nowrap">
              Cities
            </button>
          </div>
        </div>

        <!-- Groups List -->
        <div class="space-y-3">
          <template x-for="comm in filteredCommunities" :key="comm.id">
            <div 
              @click="selectCommunity(comm.id)"
              :class="activeCommunityId === comm.id ? 'border-indigo-400 dark:border-indigo-600 bg-white dark:bg-slate-900 shadow-md ring-2 ring-indigo-500/10' : 'border-slate-200 dark:border-slate-800 bg-white/70 dark:bg-slate-900/70 hover:bg-white dark:hover:bg-slate-900'"
              class="card p-4 cursor-pointer transition-all border flex flex-col justify-between">
              
              <div class="flex items-start gap-3">
                <img :src="comm.avatar" :alt="comm.name" class="w-12 h-12 rounded-2xl object-cover flex-shrink-0" loading="lazy">
                <div class="min-w-0 flex-1">
                  <div class="flex items-center justify-between gap-1">
                    <h3 class="font-bold text-sm text-slate-900 dark:text-white truncate" x-text="comm.name"></h3>
                  </div>
                  <div class="flex items-center gap-1.5 mt-0.5">
                    <span class="text-[10px] font-semibold px-1.5 py-0.2 rounded bg-indigo-50 dark:bg-indigo-950 text-indigo-600 dark:text-indigo-400" x-text="comm.category"></span>
                    <span class="text-slate-300 dark:text-slate-700">•</span>
                    <span class="text-[11px] text-slate-500 dark:text-slate-400" x-text="comm.city"></span>
                  </div>
                  <p class="text-xs text-slate-500 dark:text-slate-400 mt-1 line-clamp-2 leading-relaxed" x-text="comm.description"></p>
                </div>
              </div>

              <!-- Membership action footer -->
              <div class="mt-3 pt-3 border-t border-slate-100 dark:border-slate-800/80 flex items-center justify-between">
                <span class="text-xs font-semibold text-slate-600 dark:text-slate-300" x-text="comm.membersDisplay"></span>
                
                <button 
                  @click.stop="toggleMembership(comm)"
                  :class="comm.isJoined ? 'bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 border-slate-200 dark:border-slate-700' : 'bg-indigo-600 text-white shadow-sm'"
                  class="text-xs font-bold px-3 py-1.5 rounded-xl border transition-all flex items-center gap-1.5">
                  <i x-show="comm.isJoined" data-lucide="check" class="w-3.5 h-3.5 text-emerald-500"></i>
                  <span x-text="comm.isJoined ? 'Joined' : 'Join'"></span>
                </button>
              </div>

            </div>
          </template>
        </div>

      </div>


      <!-- ===================================================================== -->
      <!-- CENTER & RIGHT: ACTIVE COMMUNITY FEED (8 COLS ON LG)                 -->
      <!-- ===================================================================== -->
      <div class="lg:col-span-8 space-y-6">
        
        <!-- Active Community Header Banner -->
        <template x-if="activeCommunity">
          <div class="card overflow-hidden">
            <!-- Cover image -->
            <div class="h-36 sm:h-48 w-full relative overflow-hidden bg-indigo-900">
              <img :src="activeCommunity.coverImg" :alt="activeCommunity.name" class="w-full h-full object-cover opacity-80" loading="lazy">
              <div class="absolute inset-0 bg-gradient-to-t from-slate-950/80 via-transparent to-transparent"></div>
              
              <div class="absolute bottom-4 left-4 right-4 flex items-end justify-between gap-4 text-white">
                <div class="flex items-center gap-3">
                  <img :src="activeCommunity.avatar" :alt="activeCommunity.name" class="w-14 h-14 rounded-2xl object-cover border-2 border-white dark:border-slate-900 shadow-md" loading="lazy">
                  <div>
                    <div class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full bg-white/20 backdrop-blur-md text-[10px] font-bold text-lime-300 mb-1">
                      <span class="w-1.5 h-1.5 rounded-full bg-lime-400"></span>
                      <span x-text="activeCommunity.category"></span>
                    </div>
                    <h1 class="font-heading font-bold text-xl sm:text-2xl text-white leading-tight" x-text="activeCommunity.name"></h1>
                  </div>
                </div>

                <button 
                  @click="toggleMembership(activeCommunity)"
                  :class="activeCommunity.isJoined ? 'bg-white/20 backdrop-blur-md text-white border-white/30' : 'bg-lime-400 text-slate-900 font-bold'"
                  class="px-4 py-2 rounded-xl text-xs font-bold transition-all shadow-md flex items-center gap-1.5">
                  <i x-show="activeCommunity.isJoined" data-lucide="check" class="w-3.5 h-3.5 text-lime-300"></i>
                  <span x-text="activeCommunity.isJoined ? 'Joined Tribe' : 'Join Community'"></span>
                </button>
              </div>
            </div>

            <!-- Banner details & rules -->
            <div class="p-5 flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-white dark:bg-slate-900">
              <p class="text-xs text-slate-600 dark:text-slate-300 max-w-xl leading-relaxed" x-text="activeCommunity.description"></p>
              <div class="flex items-center gap-3 text-xs text-slate-500 dark:text-slate-400 flex-shrink-0">
                <div class="flex items-center gap-1">
                  <i data-lucide="users" class="w-4 h-4 text-indigo-500"></i>
                  <strong class="text-slate-900 dark:text-white" x-text="activeCommunity.membersDisplay"></strong>
                </div>
                <span>•</span>
                <div class="flex items-center gap-1">
                  <i data-lucide="shield-check" class="w-4 h-4 text-emerald-500"></i>
                  <span>Zero Brokerage</span>
                </div>
              </div>
            </div>
          </div>
        </template>


        <!-- Post Creator Card -->
        <div class="card p-5">
          <div class="flex items-start gap-3">
            <img src="https://picsum.photos/seed/rohan_dev/200/200" alt="Rohan" class="w-10 h-10 rounded-2xl object-cover flex-shrink-0" loading="lazy">
            <div class="flex-1 space-y-3">
              <textarea 
                x-model="newPostContent"
                rows="2" 
                placeholder="Share a flat vacancy, ask for advice, or post a trip update in this community..."
                class="w-full p-3 rounded-2xl bg-slate-50 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 text-sm text-slate-900 dark:text-white placeholder:text-slate-400 focus:outline-none focus:border-indigo-500 resize-none transition-colors"></textarea>
              
              <div class="flex flex-wrap items-center justify-between gap-3">
                <div class="flex items-center gap-1.5 text-xs">
                  <span class="text-slate-400 text-[11px]">Topic:</span>
                  <select 
                    x-model="newPostTag" 
                    class="bg-slate-100 dark:bg-slate-800 border-0 rounded-lg px-2.5 py-1 text-xs font-semibold text-indigo-600 dark:text-indigo-400 outline-none">
                    <option value="#Update">#Update</option>
                    <option value="#FlatVacant">#FlatVacant</option>
                    <option value="#RoommateWanted">#RoommateWanted</option>
                    <option value="#WeekendTrip">#WeekendTrip</option>
                    <option value="#CampusNotes">#CampusNotes</option>
                    <option value="#ZeroBrokerage">#ZeroBrokerage</option>
                  </select>
                </div>

                <div class="flex items-center gap-2">
                  <button 
                    @click="submitPost()"
                    :disabled="!newPostContent || !newPostContent.trim() || isSubmittingPost"
                    class="btn btn-primary text-xs px-4 py-2 shadow-sm disabled:opacity-50 disabled:cursor-not-allowed">
                    <span x-text="isSubmittingPost ? 'Posting...' : 'Post to Feed'"></span>
                    <i data-lucide="send" class="w-3.5 h-3.5"></i>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>


        <!-- Community Feed Posts List -->
        <div class="space-y-4">
          <template x-if="activeCommunity && activeCommunity.posts && activeCommunity.posts.length > 0">
            <template x-for="post in activeCommunity.posts" :key="post.id">
              <article class="card p-5 space-y-3 hover:border-slate-300 dark:hover:border-slate-700 transition-colors">
                
                <!-- Post Author Header -->
                <div class="flex items-center justify-between">
                  <div class="flex items-center gap-3">
                    <img :src="post.author.avatar" :alt="post.author.name" class="w-10 h-10 rounded-2xl object-cover" loading="lazy">
                    <div>
                      <div class="flex items-center gap-1.5">
                        <h4 class="font-bold text-sm text-slate-900 dark:text-white" x-text="post.author.name"></h4>
                        <i x-show="post.author.verified" data-lucide="check-circle" class="w-3.5 h-3.5 text-indigo-500"></i>
                      </div>
                      <p class="text-[11px] text-slate-500 dark:text-slate-400" x-text="post.author.role + ' • ' + post.timeAgo"></p>
                    </div>
                  </div>

                  <!-- DM Direct Button -->
                  <a href="chat.html" class="p-2 rounded-xl text-slate-400 hover:text-indigo-600 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors" title="Message user on in-app chat">
                    <i data-lucide="message-circle" class="w-4 h-4"></i>
                  </a>
                </div>

                <!-- Post Content Body -->
                <p class="text-sm text-slate-800 dark:text-slate-200 leading-relaxed" x-text="post.content"></p>

                <!-- Post Tags -->
                <div class="flex flex-wrap gap-1.5 pt-1">
                  <template x-for="tag in post.tags" :key="tag">
                    <span class="text-[10px] font-bold px-2 py-0.5 rounded-md bg-indigo-50 dark:bg-indigo-950 text-indigo-600 dark:text-indigo-400" x-text="tag"></span>
                  </template>
                </div>

                <!-- Post Engagement Footer -->
                <div class="pt-3 border-t border-slate-100 dark:border-slate-800 flex items-center justify-between text-xs text-slate-500 dark:text-slate-400">
                  <div class="flex items-center gap-4">
                    <!-- Like button -->
                    <button 
                      @click="togglePostLike(post)"
                      :class="post.isLiked ? 'text-rose-500 font-bold' : 'hover:text-rose-500'"
                      class="flex items-center gap-1.5 transition-colors">
                      <i data-lucide="heart" class="w-4 h-4" :class="{ 'fill-rose-500 text-rose-500': post.isLiked }"></i>
                      <span x-text="post.likes"></span>
                    </button>

                    <!-- Comments button -->
                    <button 
                      @click="showToast('Discussion thread open — you can reply directly!', 'info')"
                      class="flex items-center gap-1.5 hover:text-indigo-600 transition-colors">
                      <i data-lucide="message-square" class="w-4 h-4"></i>
                      <span x-text="post.commentsCount + ' comments'"></span>
                    </button>
                  </div>

                  <!-- In-App Safe Contact Button -->
                  <a href="chat.html" class="text-indigo-600 dark:text-indigo-400 font-semibold hover:underline flex items-center gap-1">
                    <span>Chat Safely</span>
                    <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i>
                  </a>
                </div>

              </article>
            </template>
          </template>

          <!-- Empty Feed State -->
          <template x-if="!activeCommunity || !activeCommunity.posts || activeCommunity.posts.length === 0">
            <div class="card p-12 text-center space-y-3">
              <i data-lucide="sparkles" class="w-10 h-10 text-indigo-400 mx-auto"></i>
              <h3 class="font-heading font-bold text-lg text-slate-800 dark:text-slate-200">No posts in this tribe yet</h3>
              <p class="text-xs text-slate-500 dark:text-slate-400 max-w-sm mx-auto">Be the first to share an update, flat search, or campus question!</p>
            </div>
          </template>
        </div>

      </div>

    </div>

  </main>

  <!-- ========================================================================= -->
  <!-- 3. FOOTER                                                                 -->
  <!-- ========================================================================= -->
  <footer class="mt-20 border-t border-slate-200 dark:border-slate-800 bg-[#fafaf7] dark:bg-[#0b1120] py-12">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 flex flex-col md:flex-row items-center justify-between gap-4 text-xs text-slate-500 dark:text-slate-400">
      <div class="flex items-center gap-2">
        <div class="w-6 h-6 rounded-lg bg-indigo-600 flex items-center justify-center text-white font-bold text-xs">J</div>
        <span class="font-heading font-semibold text-slate-800 dark:text-slate-200">JhoomRahi</span>
        <span>• Pan-India Student & Young Pro Network</span>
      </div>
      <div>
        <span>© <span id="current-year">2026</span> JhoomRahi. Zero Brokerage Guarantee.</span>
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="assets/js/data.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/dashboard.js"></script>
</body>
</html>
